services:
  frontend:
    image: casino-frontend:v1.0.0
    container_name: casino-frontend

    environment:
      - BACKEND_HOST=backend

    ports:
      - "80:8080"

    depends_on:
      - backend

    networks:
      - casino-network

  postgres:
    image: postgres:16-alpine
    container_name: casino-postgres

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casino -d casino_db"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - casino-network

  backend:
    build: .

    container_name: casino-backend

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - .env

    environment:
      DB_HOST: postgres

    ports:
      - "3000:3000"

    networks:
      - casino-network

volumes:
  postgres_data:

networks:
  casino-network: